[project]
name = "nlt"
version = "0.1.0"
description = "Plain-English auto-trading platform for NIFTY (Zerodha)"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
    "yfinance>=0.2.50",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: touches the live network/market data, skipped by default"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes and pycodestyle catch real mistakes; isort keeps imports tidy;
# pyupgrade keeps us on current syntax. Everything else is style opinion we
# do not need a tool to arbitrate.
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter
