[project]
name = "nlt"
version = "0.1.0"
description = "Plain-English auto-trading platform for NIFTY (Zerodha)"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
    "yfinance>=0.2.50",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7", "mutmut>=3.8"]

# Reading the historical F&O exports. They are ClickHouse Native format, which
# no ordinary library opens; `chdb` is an embedded ClickHouse that does. Kept
# out of the main dependencies because only the import scripts need it -- the
# engine reads the Parquet that comes out the other side.
fno = ["chdb>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: touches the live network/market data, skipped by default"]

[tool.ruff]
line-length = 100
target-version = "py312"

# `legacy/` is an abandoned prototype kept only for reference -- it describes an
# approach this project deliberately moved away from. Linting it produced ten of
# the eleven errors in the repo and none of them were ever going to be fixed,
# which is how a tool teaches you to ignore its output.
exclude = ["legacy"]

[tool.ruff.lint]
# Pyflakes and pycodestyle catch real mistakes; isort keeps imports tidy;
# pyupgrade keeps us on current syntax. Everything else is style opinion we
# do not need a tool to arbitrate.
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.mutmut]
# Mutation testing: does a test actually FAIL when the code breaks, or does it
# merely execute the line? This project has always done this by hand -- every
# claim in HANDOFF.md was checked by mutating the code and confirming a test
# noticed, which is how it found an engine reporting -113%, stops filling at
# prices that never traded, and a readback promising a square-off the engine
# skipped. None of those were caught by tests that already passed.
#
# Doing it by hand means it happens when someone remembers. This makes it a
# command.
#
# Scoped deliberately to the code where a silent error costs money. Mutating
# the whole tree takes hours and buries the signal; `app/` is layout, and
# `nlt/translate/` is better served by the 70-sentence corpus, which is a
# stronger test than any mutant.
source_paths = ["nlt/engine", "nlt/costs", "nlt/spec"]

# mutmut runs the suite against a rewritten copy of the tree, and copies only
# what it mutates. Without this the copy has no `app/`, no `nlt/data/`, and no
# bar cache, so collection dies on the first import and every mutant is scored
# as "killed" by an error that has nothing to do with the mutation.
also_copy = ["app", "nlt", "data", "tests/fixtures"]
pytest_add_cli_args_test_selection = ["tests/"]
