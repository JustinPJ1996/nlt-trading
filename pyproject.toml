[project]
name = "nlt"
version = "0.1.0"
description = "Plain-English auto-trading platform for NIFTY (Zerodha)"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
    "yfinance>=0.2.50",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
